[workspace]
members = [
    "crates/sbe",
    "crates/transport",
    "crates/cluster",
    "services/matching-engine",
    "services/api/rest",
    "services/api/websocket",
    "services/market-data/level2",
    "services/market-data/ticker",
    "services/trade-reporter",
    "services/outbox",
    "tools",
]

resolver = "3"

[workspace.dependencies]
sbe = { path = "crates/sbe" }
transport = { path = "crates/transport" }
cluster = { path = "crates/cluster" }

[workspace.package]
edition = "2024"

# Full cross-crate optimization for deployed binaries. It's kept out of `release` so that normal
# rebuilds stay fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
