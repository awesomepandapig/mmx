[workspace]
members = [
    "sbe",
    "transport",
    "tools",
    "observer",
    "api",
    "matching-engine",
    "market-data/level2",
    "market-data/ticker",
    "websocket",
    "trade-reporter",
]

resolver = "3"

[workspace.dependencies]
sbe = { path = "sbe" }
transport = { path = "transport" }

[workspace.package]
edition = "2024"

# Full cross-crate optimization for deployed binaries. It's kept out of `release` so that normal
# rebuilds stay fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
