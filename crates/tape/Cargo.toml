[package]
name = "tape"
version = "0.1.0"
edition = "2024"

[features]
# The NATS publishing loop shared by `level2`, `ticker` and `candles`.
feed = ["dep:async-nats", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
async-nats = { version = "0.42.0", optional = true }
chrono = "0.4.41"
rusteron-archive = { version = "0.2.16", features = ["static"] }
sbe = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", optional = true }
transport = { workspace = true }
