[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = "0.8.4"
chrono = "0.4.41"
env_logger = "0.11.8"
log = "0.4.27"
sbe = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
transport = { workspace = true }
cluster = { workspace = true }
uuid = { version = "1.17.0", features = ["serde", "v4", "v7"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["query"] }
serde_yaml = "0.9"
subtle = "2"
async-trait = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.45.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
