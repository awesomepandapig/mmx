[package]
name = "matching-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
sbe = { workspace = true }
transport = { workspace = true }
cluster = { workspace = true }
priority-queue = "2.3.1"
slab = "0.4.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
foldhash = "0.2.0"

[features]
# Compiles out every log call in release builds. Metrics come from `observer` instead.
silent = ["tracing/release_max_level_off"]
