[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }
sbe = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
transport = { workspace = true }
cluster = { workspace = true }
rusteron-archive = { version = "0.2.16", features = ["static"] }
