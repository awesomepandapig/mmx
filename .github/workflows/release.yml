name: Release published MMX

on:
  push:
    branches: ["release/mmx-*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v (first release: 0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mmx-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.names.outputs.registry }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        run: echo "VERSION=${VERSION#release/mmx-}" >> "$GITHUB_ENV"
      - name: Validate release version and refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.VERSION)) process.exit(1)'
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; choose a new version" >&2
            exit 1
          fi
      - id: names
        name: Resolve lowercase GHCR namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "registry=ghcr.io/${OWNER,,}/mmx" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
      - run: deploy/scripts/validate.sh

  images:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      ARCH: ${{ matrix.arch }}
      PLATFORMS: linux/${{ matrix.arch }}
      CARGO_INCREMENTAL: '0'
      CACHE_SCOPE: release-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stamp the CLI version before building images
        run: node deploy/release/version-cli.mjs "$VERSION"
      - name: Cache native dependencies
        run: docker buildx bake -f deploy/docker/docker-bake.hcl deps --progress=plain
      - name: Test native services before publishing
        run: docker buildx bake -f deploy/docker/docker-bake.hcl test --progress=plain
      - name: Build and push native core images
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          export TAG="$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker buildx bake -f deploy/docker/docker-bake.hcl core --push \
            --metadata-file metadata.json \
            --set "*.labels.org.opencontainers.image.source=$SOURCE_URL" \
            --set "*.labels.org.opencontainers.image.revision=$GITHUB_SHA" \
            --set "*.labels.org.opencontainers.image.version=$VERSION"
          for image in node matching-engine api mmx outbox websocket market-data trade-reporter; do
            digest=$(jq -er --arg image "$image" '.[$image]["containerimage.digest"]' metadata.json)
            printf '%s\t%s\n' "$image" "$digest" >> "digests-$ARCH.tsv"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-image-digests-${{ matrix.arch }}
          path: digests-${{ matrix.arch }}.tsv

  package:
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-image-digests-*
          merge-multiple: true
          path: native
      - name: Merge architectures and lock published manifests
        run: |
          for image in node matching-engine api mmx outbox websocket market-data trade-reporter; do
            amd=$(awk -v image="$image" '$1 == image {print $2}' native/digests-amd64.tsv)
            arm=$(awk -v image="$image" '$1 == image {print $2}' native/digests-arm64.tsv)
            test -n "$amd" && test -n "$arm"
            docker buildx imagetools create --tag "$REGISTRY/$image:$VERSION" \
              "$REGISTRY/$image@$amd" "$REGISTRY/$image@$arm"
            digest=$(docker buildx imagetools inspect "$REGISTRY/$image:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)
            printf '%s\t%s\n' "$image" "$digest" >> image-digests.tsv
          done
          for pair in nats=docker.io/library/nats:2-alpine valkey=docker.io/valkey/valkey:8-alpine questdb=docker.io/questdb/questdb:8.2.3 tests=docker.io/curlimages/curl:8.11.1; do
            name=${pair%%=*}
            ref=${pair#*=}
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest)
            printf '%s\t%s\n' "$name" "$digest" >> image-digests.tsv
          done
      - name: Prepare immutable chart and Compose assets
        run: |
          node deploy/release/prepare.mjs "$VERSION" "$REGISTRY" image-digests.tsv bundle
          helm lint bundle/chart
          helm template mmx bundle/chart > /tmp/mmx-release.yaml
          mkdir -p bundle/config
          touch bundle/config/outbox.env
          MMX_ADMIN_TOKEN=release-validation docker compose -f bundle/compose.yaml config --no-env-resolution > /dev/null
          helm package bundle/chart --destination bundle
          cp deploy/install.sh bundle/install.sh
          cp deploy/kind/quickstart.yaml bundle/quickstart.yaml
          cp image-digests.tsv bundle/image-digests.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: bundle/

  cli:
    needs: [prepare, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install static Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build embedded console and versioned CLI
        run: |
          cp bundle/compose.yaml deploy/compose.yaml
          node deploy/release/version-cli.mjs "$VERSION"
          npm --prefix console ci
          npm --prefix console run build
          if [ "$PLATFORM" = linux ]; then export CC=musl-gcc; fi
          cargo build --locked --release -p mmx --target "$TARGET"
          mkdir -p binary
          cp "target/$TARGET/release/mmx" binary/mmx
          binary/mmx --version
          tar -czf "mmx-$VERSION-$PLATFORM-$ARCH.tar.gz" -C binary mmx
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: mmx-*.tar.gz

  publish:
    needs: [prepare, package, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish chart
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "release/mmx-$VERSION.tgz" "oci://$REGISTRY/charts"
      - name: Stage draft release assets
        run: |
          cd release
          sha256sum mmx-*.tar.gz "mmx-$VERSION.tgz" compose.yaml image-digests.json image-digests.tsv install.sh quickstart.yaml > SHA256SUMS
          printf 'Published images and chart are locked in image-digests.json.\n\nHelm chart: oci://%s/charts/mmx --version %s\n' "$REGISTRY" "$VERSION" > release-notes.md
          if [ "${VERSION#*-}" != "$VERSION" ]; then prerelease=--prerelease; else prerelease=; fi
          if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "v$VERSION" --clobber \
              mmx-*.tar.gz "mmx-$VERSION.tgz" SHA256SUMS compose.yaml \
              image-digests.json image-digests.tsv install.sh quickstart.yaml
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "MMX $VERSION" \
              --notes-file release-notes.md $prerelease \
              mmx-*.tar.gz "mmx-$VERSION.tgz" SHA256SUMS compose.yaml \
              image-digests.json image-digests.tsv install.sh quickstart.yaml
          fi
      - name: Verify anonymous installation access
        run: |
          node deploy/release/verify-public.mjs release/image-digests.json
          anonymous=$(mktemp -d)
          HELM_REGISTRY_CONFIG="$anonymous/helm.json" DOCKER_CONFIG="$anonymous/docker" \
            helm pull "oci://$REGISTRY/charts/mmx" --version "$VERSION" --destination "$anonymous"
          helm template mmx "$anonymous/mmx-$VERSION.tgz" > /tmp/mmx-public-release.yaml
      - name: Publish publicly installable release
        run: gh release edit "v$VERSION" --draft=false
