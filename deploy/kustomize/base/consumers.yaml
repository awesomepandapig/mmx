# The feeds keep a checkpoint on a volume, because without one they replay the whole tape, which is
# kept forever by default. trade-reporter resumes from QuestDB, so it doesn't need one.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mmx-market-data
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: market-data
    mmx.io/aeron-client: "true"
spec:
  serviceName: mmx-market-data
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mmx
      app.kubernetes.io/component: market-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmx
        app.kubernetes.io/component: market-data
        mmx.io/aeron-client: "true"
    spec:
      containers:
        - name: market-data
          image: ghcr.io/awesomepandapig/mmx/market-data:0.1.0
          envFrom:
            - secretRef:
                name: mmx-secrets
                optional: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AERON_DIR
              value: /dev/shm/aeron
            - name: CLIENT_HOST
              value: $(POD_IP)
            - name: TAPE_ARCHIVES
              value: mmx-node-0.mmx-node:8010,mmx-node-1.mmx-node:8011,mmx-node-2.mmx-node:8012
            - name: TAPE_REPORTS
              value: mmx-node-0.mmx-node:40450,mmx-node-1.mmx-node:40451,mmx-node-2.mmx-node:40452
            - name: NATS_URL
              value: nats://mmx-nats:4222
            - name: QUESTDB_CONF
              value: http::addr=mmx-questdb:9000;
            - name: QUESTDB_URL
              value: "http://mmx-questdb:9000"
            - name: RUST_LOG
              value: info
            - name: CHECKPOINT_DIR
              value: /var/lib/mmx/checkpoints
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "3"
              memory: 1536Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: data
              mountPath: /var/lib/mmx
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmx-trade-reporter
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: trade-reporter
    mmx.io/aeron-client: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mmx
      app.kubernetes.io/component: trade-reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmx
        app.kubernetes.io/component: trade-reporter
        mmx.io/aeron-client: "true"
    spec:
      containers:
        - name: trade-reporter
          image: ghcr.io/awesomepandapig/mmx/trade-reporter:0.1.0
          envFrom:
            - secretRef:
                name: mmx-secrets
                optional: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AERON_DIR
              value: /dev/shm/aeron
            - name: CLIENT_HOST
              value: $(POD_IP)
            - name: TAPE_ARCHIVES
              value: mmx-node-0.mmx-node:8010,mmx-node-1.mmx-node:8011,mmx-node-2.mmx-node:8012
            - name: TAPE_REPORTS
              value: mmx-node-0.mmx-node:40450,mmx-node-1.mmx-node:40451,mmx-node-2.mmx-node:40452
            - name: NATS_URL
              value: nats://mmx-nats:4222
            - name: QUESTDB_CONF
              value: http::addr=mmx-questdb:9000;
            - name: QUESTDB_URL
              value: "http://mmx-questdb:9000"
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
