apiVersion: v1
kind: Service
metadata:
  name: mmx-nats
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: nats
spec:
  selector:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmx-nats
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mmx
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmx
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:2-alpine
          ports:
            - name: client
              containerPort: 4222
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
---
# The default query view, which can be rebuilt from the tape. Open-source QuestDB is single-node.
apiVersion: v1
kind: Service
metadata:
  name: mmx-questdb
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: questdb
spec:
  selector:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: questdb
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: postgres
      port: 8812
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mmx-questdb
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: questdb
spec:
  serviceName: mmx-questdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mmx
      app.kubernetes.io/component: questdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmx
        app.kubernetes.io/component: questdb
    spec:
      containers:
        - name: questdb
          image: docker.io/questdb/questdb:8.2.3
          ports:
            - name: http
              containerPort: 9000
            - name: postgres
              containerPort: 8812
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/questdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
