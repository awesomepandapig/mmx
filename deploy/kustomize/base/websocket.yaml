apiVersion: v1
kind: Service
metadata:
  name: mmx-websocket
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: websocket
spec:
  selector:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: websocket
  ports:
    - name: ws
      port: 8080
      targetPort: ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmx-websocket
  labels:
    app.kubernetes.io/name: mmx
    app.kubernetes.io/component: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mmx
      app.kubernetes.io/component: websocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmx
        app.kubernetes.io/component: websocket
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: websocket
          image: ghcr.io/awesomepandapig/mmx/websocket:0.1.0
          ports:
            - name: ws
              containerPort: 8080
          envFrom:
            - secretRef:
                name: mmx-secrets
                optional: true
          env:
            - name: WS_ADDR
              value: 0.0.0.0:8080
            - name: NATS_URL
              value: nats://mmx-nats:4222
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 256Mi
