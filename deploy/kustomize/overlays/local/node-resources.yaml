apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mmx-node
spec:
  updateStrategy:
    type: RollingUpdate
  template:
    spec:
      containers:
        - name: node
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: null
              memory: 2Gi
        - name: engine
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: null
              memory: 1Gi
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
