{{- $name := printf "%s-console" (include "mmx.fullname" .) -}}
{{- $labels := dict "root" . "component" "console" -}}
{{- $console := .Values.console -}}
{{- $configName := include "mmx.configName" . -}}
{{- $secretName := include "mmx.controlSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $console.oidc.enabled }}
  {{- if not (and $console.oidc.issuer $console.oidc.clientId $console.oidc.clientSecret.name) }}
    {{- fail "console.oidc needs issuer, clientId and clientSecret.name" }}
  {{- end }}
  {{- if not $console.oidc.groups.admin }}
    {{- fail "console.oidc.groups.admin can't be empty, or nobody could run this install" }}
  {{- end }}
{{- else if not $console.passwordLogin }}
  {{- fail "console.passwordLogin can only be false with console.oidc.enabled" }}
{{- end }}
# The admin token gateways and the console share, generated once. The console adds its own keys here,
# so an upgrade writes back everything that's there. Under `helm template` and a client-side dry run
# `lookup` is empty, so a value shown there is never the real one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  MMX_ADMIN_TOKEN: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
---
# Exactly one ConfigMap and one Secret, by name. `create` and `list` can't be limited by name, so
# they aren't here: the chart makes both objects, and nothing here can read any other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $configName | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
  {{- with $console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $console.service.type }}
  selector:
    {{- include "mmx.selectorLabels" $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ $console.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
spec:
  replicas: {{ $console.replicas }}
  selector:
    matchLabels:
      {{- include "mmx.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mmx.labels" $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "mmx.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mmx.selectorLabels" $labels | nindent 14 }}
      containers:
        - name: mmx
          image: {{ include "mmx.image" (dict "root" . "image" $console.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/usr/local/bin/service", "serve"]
          ports:
            - name: http
              containerPort: {{ $console.port }}
          env:
            {{- include "mmx.adminTokenEnv" . | nindent 12 }}
            {{- with $console.adminPasswordSecret.name }}
            - name: MMX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $console.adminPasswordSecret.key }}
            {{- end }}
            {{- if not $console.passwordLogin }}
            - name: MMX_PASSWORD_LOGIN
              value: "false"
            {{- end }}
            {{- if $console.oidc.enabled }}
            - name: MMX_OIDC_ISSUER
              value: {{ $console.oidc.issuer | quote }}
            - name: MMX_OIDC_CLIENT_ID
              value: {{ $console.oidc.clientId | quote }}
            - name: MMX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $console.oidc.clientSecret.name }}
                  key: {{ $console.oidc.clientSecret.key }}
            {{- with $console.oidc.displayName }}
            - name: MMX_OIDC_DISPLAY_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: MMX_OIDC_GROUPS_CLAIM
              value: {{ $console.oidc.groupsClaim | quote }}
            - name: MMX_OIDC_ADMIN_GROUPS
              value: {{ join "," $console.oidc.groups.admin | quote }}
            - name: MMX_OIDC_OPERATOR_GROUPS
              value: {{ join "," $console.oidc.groups.operator | quote }}
            - name: MMX_OIDC_VIEWER_GROUPS
              value: {{ join "," $console.oidc.groups.viewer | quote }}
            {{- end }}
            - name: MMX_BIND
              value: "0.0.0.0:{{ $console.port }}"
            - name: MMX_STORE
              value: kubernetes
            - name: MMX_CONFIGMAP
              value: {{ $configName }}
            - name: MMX_SECRET
              value: {{ $secretName }}
            - name: MMX_GATEWAY_DNS
              value: "{{ include "mmx.fullname" . }}-gateway-pods:{{ .Values.gateway.service.port }}"
            - name: MMX_OUTBOX_URL
              value: "http://{{ include "mmx.fullname" . }}-outbox:8092"
            - name: MMX_OUTBOX_RESTART
              value: "kubectl rollout restart statefulset/{{ include "mmx.fullname" . }}-outbox --namespace {{ .Release.Namespace }}"
            {{- if .Values.questdb.enabled }}
            - name: QUESTDB_URL
              value: "http://{{ include "mmx.fullname" . }}-questdb:9000"
            {{- end }}
            {{- if .Values.nats.enabled }}
            - name: NATS_URL
              value: "nats://{{ include "mmx.fullname" . }}-nats:4222"
            {{- end }}
            {{- if .Values.valkey.enabled }}
            - name: VALKEY_URL
              value: "redis://{{ include "mmx.fullname" . }}-valkey:6379"
            {{- end }}
            - name: RUST_LOG
              value: {{ $console.rustLog | quote }}
          securityContext:
            {{- include "mmx.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- include "mmx.resources" (dict "resources" $console.resources "guaranteed" false) | nindent 12 }}
{{- if gt (int $console.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "mmx.labels" $labels | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "mmx.selectorLabels" $labels | nindent 6 }}
{{- end }}
